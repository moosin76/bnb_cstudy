<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
  <title id="title">포인터를 통해 원래 변수의 값을 바꾸는 모습</title>
  <desc id="desc">p가 a를 가리키는 상태에서 *p = 100을 실행하면 a의 값이 10에서 100으로 바뀌는 과정을 보여준다.</desc>
  <rect width="960" height="400" rx="24" fill="#f8fafc"/>
  <g font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
    <text x="480" y="48" text-anchor="middle" font-size="28" font-weight="700" fill="#0f172a">*p = 100 은 p가 가리키는 원래 값을 바꿉니다</text>

    <rect x="70" y="105" width="300" height="190" rx="20" fill="#eef6ff" stroke="#3b82f6" stroke-width="3"/>
    <text x="220" y="145" text-anchor="middle" font-size="22" font-weight="700" fill="#334155">변경 전</text>
    <text x="145" y="210" text-anchor="middle" font-size="31" font-family="Consolas, monospace" fill="#1d4ed8">p</text>
    <line x1="175" y1="203" x2="235" y2="203" stroke="#64748b" stroke-width="6"/>
    <polygon points="235,203 217,191 217,215" fill="#64748b"/>
    <text x="292" y="210" text-anchor="middle" font-size="31" font-family="Consolas, monospace" fill="#276749">a = 10</text>
    <text x="220" y="258" text-anchor="middle" font-size="20" font-family="Consolas, monospace" fill="#475569">int *p = &amp;a;</text>

    <line x1="395" y1="200" x2="560" y2="200" stroke="#f59e0b" stroke-width="8" stroke-linecap="round"/>
    <polygon points="560,200 535,183 535,217" fill="#f59e0b"/>
    <text x="477" y="170" text-anchor="middle" font-size="25" font-family="Consolas, monospace" font-weight="700" fill="#b45309">*p = 100;</text>

    <rect x="590" y="105" width="300" height="190" rx="20" fill="#effcf4" stroke="#55b37a" stroke-width="3"/>
    <text x="740" y="145" text-anchor="middle" font-size="22" font-weight="700" fill="#334155">변경 후</text>
    <text x="665" y="210" text-anchor="middle" font-size="31" font-family="Consolas, monospace" fill="#1d4ed8">p</text>
    <line x1="695" y1="203" x2="755" y2="203" stroke="#64748b" stroke-width="6"/>
    <polygon points="755,203 737,191 737,215" fill="#64748b"/>
    <text x="812" y="210" text-anchor="middle" font-size="31" font-family="Consolas, monospace" font-weight="700" fill="#276749">a = 100</text>
    <text x="740" y="258" text-anchor="middle" font-size="19" fill="#475569">p의 주소는 그대로, a의 값만 바뀜</text>

    <text x="480" y="350" text-anchor="middle" font-size="21" fill="#475569">포인터를 이용하면 “가리키는 변수”의 원래 값을 직접 바꿀 수 있습니다.</text>
  </g>
</svg>