<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
<title id="title">열거형으로 숫자에 의미 있는 이름을 붙이는 모습</title><desc id="desc">0 1 2 같은 숫자를 READY RUNNING DONE 같은 이름으로 표현한다.</desc>
<rect width="960" height="360" rx="24" fill="#f8fafc"/>
<g font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
<text x="480" y="50" text-anchor="middle" font-size="28" font-weight="700" fill="#0f172a">enum은 숫자 상태에 읽기 쉬운 이름을 붙입니다</text>
<rect x="80" y="120" width="210" height="120" rx="18" fill="#fff" stroke="#64748b" stroke-width="3"/><text x="185" y="165" text-anchor="middle" font-size="22" fill="#475569">숫자 0</text><text x="185" y="210" text-anchor="middle" font-family="Consolas, monospace" font-size="25" font-weight="700" fill="#0f172a">READY</text>
<rect x="375" y="120" width="210" height="120" rx="18" fill="#fff" stroke="#3b82f6" stroke-width="3"/><text x="480" y="165" text-anchor="middle" font-size="22" fill="#475569">숫자 1</text><text x="480" y="210" text-anchor="middle" font-family="Consolas, monospace" font-size="25" font-weight="700" fill="#1d4ed8">RUNNING</text>
<rect x="670" y="120" width="210" height="120" rx="18" fill="#fff" stroke="#16a34a" stroke-width="3"/><text x="775" y="165" text-anchor="middle" font-size="22" fill="#475569">숫자 2</text><text x="775" y="210" text-anchor="middle" font-family="Consolas, monospace" font-size="25" font-weight="700" fill="#166534">DONE</text>
<text x="480" y="310" text-anchor="middle" font-size="20" fill="#334155">status == 2 보다 status == DONE 이 뜻을 이해하기 쉽습니다.</text>
</g></svg>