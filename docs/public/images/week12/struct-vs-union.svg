<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-labelledby="title desc">
<title id="title">구조체와 공용체의 메모리 사용 차이</title><desc id="desc">구조체는 각 멤버가 별도 공간을 가지며 공용체는 멤버들이 같은 공간을 공유한다.</desc>
<rect width="960" height="470" rx="24" fill="#f8fafc"/>
<g font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
<text x="480" y="48" text-anchor="middle" font-size="28" font-weight="700" fill="#0f172a">구조체와 공용체의 가장 큰 차이: 메모리 공간</text>
<rect x="55" y="90" width="400" height="310" rx="20" fill="#fff" stroke="#3b82f6" stroke-width="3"/>
<text x="255" y="130" text-anchor="middle" font-size="25" font-weight="700" fill="#1d4ed8">struct · 각각 자기 방</text>
<rect x="105" y="165" width="300" height="55" rx="8" fill="#dbeafe"/><text x="255" y="200" text-anchor="middle" font-size="20" fill="#0f172a">int number</text>
<rect x="105" y="230" width="300" height="55" rx="8" fill="#dcfce7"/><text x="255" y="265" text-anchor="middle" font-size="20" fill="#0f172a">double weight</text>
<rect x="105" y="295" width="300" height="55" rx="8" fill="#fef3c7"/><text x="255" y="330" text-anchor="middle" font-size="20" fill="#0f172a">char grade</text>
<text x="255" y="382" text-anchor="middle" font-size="19" fill="#475569">세 값을 동시에 보관 가능</text>
<rect x="505" y="90" width="400" height="310" rx="20" fill="#fff" stroke="#ef4444" stroke-width="3"/>
<text x="705" y="130" text-anchor="middle" font-size="25" font-weight="700" fill="#b91c1c">union · 같은 방을 함께 사용</text>
<rect x="570" y="175" width="270" height="150" rx="14" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
<text x="705" y="215" text-anchor="middle" font-size="19" fill="#991b1b">int number</text>
<text x="705" y="255" text-anchor="middle" font-size="19" fill="#166534">double weight</text>
<text x="705" y="295" text-anchor="middle" font-size="19" fill="#92400e">char grade</text>
<text x="705" y="355" text-anchor="middle" font-size="19" fill="#475569">한 순간에는 한 값 중심으로 사용</text>
<text x="480" y="440" text-anchor="middle" font-size="21" font-weight="700" fill="#334155">struct = 따로 저장 · union = 같은 메모리를 공유</text>
</g></svg>