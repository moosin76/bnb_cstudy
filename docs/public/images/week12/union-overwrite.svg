<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
<title id="title">공용체에서 새 멤버 값을 저장하면 같은 메모리 내용이 바뀌는 모습</title><desc id="desc">공용체의 정수 멤버에 값을 쓴 뒤 실수 멤버에 새 값을 쓰면 같은 메모리 공간이 새 값의 표현으로 바뀐다.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#ef4444"/></marker></defs>
<rect width="960" height="430" rx="24" fill="#f8fafc"/>
<g font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
<text x="480" y="48" text-anchor="middle" font-size="28" font-weight="700" fill="#0f172a">공용체는 같은 메모리를 다시 사용합니다</text>
<rect x="70" y="105" width="325" height="225" rx="18" fill="#fff" stroke="#3b82f6" stroke-width="3"/>
<text x="232" y="145" text-anchor="middle" font-family="Consolas, monospace" font-size="24" fill="#1d4ed8">data.number = 10;</text>
<rect x="120" y="185" width="225" height="75" rx="12" fill="#dbeafe"/>
<text x="232" y="232" text-anchor="middle" font-size="25" font-weight="700" fill="#0f172a">10 저장</text>
<text x="232" y="300" text-anchor="middle" font-size="18" fill="#475569">공유 공간의 현재 내용</text>
<line x1="415" y1="220" x2="545" y2="220" stroke="#ef4444" stroke-width="5" marker-end="url(#a)"/>
<text x="480" y="195" text-anchor="middle" font-size="18" font-weight="700" fill="#b91c1c">다른 멤버에 저장</text>
<rect x="565" y="105" width="325" height="225" rx="18" fill="#fff" stroke="#ef4444" stroke-width="3"/>
<text x="727" y="145" text-anchor="middle" font-family="Consolas, monospace" font-size="23" fill="#b91c1c">data.weight = 3.5;</text>
<rect x="615" y="185" width="225" height="75" rx="12" fill="#fee2e2"/>
<text x="727" y="232" text-anchor="middle" font-size="25" font-weight="700" fill="#0f172a">3.5 저장</text>
<text x="727" y="300" text-anchor="middle" font-size="18" fill="#475569">같은 공간이 새 내용으로 변경</text>
<text x="480" y="385" text-anchor="middle" font-size="21" fill="#334155">공용체의 멤버를 여러 개 동시에 독립된 값처럼 보관하면 안 됩니다.</text>
</g></svg>