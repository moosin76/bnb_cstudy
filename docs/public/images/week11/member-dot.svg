<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="t d"><title id="t">점 연산자로 구조체 멤버 선택하기</title><desc id="d">student 점 age가 student 구조체 안의 age 칸을 선택하는 과정을 보여준다</desc><rect width="960" height="360" rx="24" fill="#f8fafc"/><g font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif"><text x="480" y="48" text-anchor="middle" font-size="28" font-weight="700" fill="#0f172a">student.age = student 안의 age 칸을 선택</text><rect x="70" y="105" width="250" height="165" rx="20" fill="#fff" stroke="#6366f1" stroke-width="4"/><text x="195" y="150" text-anchor="middle" font-size="28" font-weight="700" fill="#4338ca">student</text><text x="195" y="195" text-anchor="middle" font-size="22" fill="#475569">구조체 변수</text><text x="385" y="190" text-anchor="middle" font-size="58" font-weight="700" fill="#0f172a">.</text><rect x="455" y="105" width="200" height="165" rx="20" fill="#fff7ed" stroke="#f59e0b" stroke-width="4"/><text x="555" y="160" text-anchor="middle" font-size="29" font-weight="700" fill="#b45309">age</text><text x="555" y="205" text-anchor="middle" font-size="21" fill="#475569">멤버 이름</text><text x="715" y="190" text-anchor="middle" font-size="50" fill="#64748b">→</text><rect x="770" y="125" width="125" height="125" rx="20" fill="#ecfdf5" stroke="#10b981" stroke-width="4"/><text x="832" y="178" text-anchor="middle" font-size="22" fill="#475569">값</text><text x="832" y="218" text-anchor="middle" font-size="32" font-weight="700" fill="#047857">20</text><text x="480" y="325" text-anchor="middle" font-size="20" fill="#475569">점(.)은 “이 묶음 안에서 이 항목을 골라줘”라고 생각하면 쉽습니다.</text></g></svg>