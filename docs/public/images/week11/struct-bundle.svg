<svg xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img" aria-labelledby="t d"><title id="t">구조체는 서로 다른 자료형을 하나로 묶는다</title><desc id="d">학생 한 명의 이름, 나이, 점수를 Student 구조체 하나에 묶는 그림</desc><rect width="960" height="390" rx="24" fill="#f8fafc"/><g font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif"><text x="480" y="48" text-anchor="middle" font-size="28" font-weight="700" fill="#0f172a">따로 있던 정보를 한 사람의 정보로 묶기</text><rect x="55" y="100" width="190" height="82" rx="16" fill="#fff" stroke="#3b82f6" stroke-width="3"/><text x="150" y="133" text-anchor="middle" font-size="20" fill="#334155">이름</text><text x="150" y="163" text-anchor="middle" font-size="24" font-weight="700" fill="#1d4ed8">"민수"</text><rect x="55" y="205" width="190" height="82" rx="16" fill="#fff" stroke="#f59e0b" stroke-width="3"/><text x="150" y="238" text-anchor="middle" font-size="20" fill="#334155">나이</text><text x="150" y="268" text-anchor="middle" font-size="24" font-weight="700" fill="#b45309">20</text><rect x="55" y="310" width="190" height="60" rx="16" fill="#fff" stroke="#10b981" stroke-width="3"/><text x="150" y="347" text-anchor="middle" font-size="22" font-weight="700" fill="#047857">92.5점</text><text x="330" y="225" text-anchor="middle" font-size="56" fill="#64748b">→</text><rect x="410" y="88" width="470" height="265" rx="22" fill="#eef6ff" stroke="#6366f1" stroke-width="4"/><text x="645" y="130" text-anchor="middle" font-size="29" font-weight="700" fill="#4338ca">struct Student</text><rect x="470" y="160" width="350" height="50" rx="12" fill="#fff"/><text x="645" y="193" text-anchor="middle" font-size="22" fill="#0f172a">name = "민수"</text><rect x="470" y="225" width="350" height="50" rx="12" fill="#fff"/><text x="645" y="258" text-anchor="middle" font-size="22" fill="#0f172a">age = 20</text><rect x="470" y="290" width="350" height="50" rx="12" fill="#fff"/><text x="645" y="323" text-anchor="middle" font-size="22" fill="#0f172a">score = 92.5</tex