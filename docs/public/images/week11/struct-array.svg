<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="t d"><title id="t">구조체 배열</title><desc id="d">Student 구조체 세 개가 students 배열에 차례로 들어 있는 그림</desc><rect width="960" height="430" rx="24" fill="#f8fafc"/><g font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif"><text x="480" y="48" text-anchor="middle" font-size="28" font-weight="700" fill="#0f172a">학생 여러 명 = 구조체 여러 개를 배열로</text><text x="480" y="86" text-anchor="middle" font-size="22" font-family="Consolas, monospace" fill="#334155">struct Student students[3];</text><g><rect x="65" y="125" width="250" height="230" rx="20" fill="#fff" stroke="#3b82f6" stroke-width="3"/><text x="190" y="162" text-anchor="middle" font-size="23" font-weight="700" fill="#1d4ed8">students[0]</text><text x="190" y="215" text-anchor="middle" font-size="21" fill="#334155">이름: 민수</text><text x="190" y="255" text-anchor="middle" font-size="21" fill="#334155">나이: 20</text><text x="190" y="295" text-anchor="middle" font-size="21" fill="#334155">점수: 90</text></g><g><rect x="355" y="125" width="250" height="230" rx="20" fill="#fff" stroke="#8b5cf6" stroke-width="3"/><text x="480" y="162" text-anchor="middle" font-size="23" font-weight="700" fill="#6d28d9">students[1]</text><text x="480" y="215" text-anchor="middle" font-size="21" fill="#334155">이름: 영희</text><text x="480" y="255" text-anchor="middle" font-size="21" fill="#334155">나이: 21</text><text x="480" y="295" text-anchor="middle" font-size="21" fill="#334155">점수: 95</text></g><g><rect x="645" y="125" width="250" height="230" rx="20" fill="#fff" stroke="#10b981" stroke-width="3"/><text x="770" y="162" text-anchor="middle" font-size="23" font-weight="700" fill="#047857">students[2]</text><text x="770" y="215" text-anchor="middle" font-size="21" fill="#334155">이름: 철수</text><text x="770" y="255" text-anchor="middle" font-size="21" fill="#334155">나이: 19</text><text x="770" y="295" text-anchor="middle" font-size="21" fill="#334155">점수: 88</text></g><text x="480" y="398" text-anchor="middle" font-size="20" fill="#475569">배열의 한 칸마다 Student 구조체 한 개가 들어갑니다.</text></g></svg>