<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="t d"><title id="t">구조체 안에 다른 구조체 넣기</title><desc id="d">Student 구조체 안에 Date 구조체가 birth 멤버로 들어 있는 중첩 구조체 그림</desc><rect width="960" height="420" rx="24" fill="#f8fafc"/><g font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif"><text x="480" y="48" text-anchor="middle" font-size="28" font-weight="700" fill="#0f172a">큰 묶음 안에 작은 묶음을 넣을 수도 있습니다</text><rect x="180" y="90" width="600" height="285" rx="24" fill="#eef6ff" stroke="#6366f1" stroke-width="4"/><text x="480" y="132" text-anchor="middle" font-size="28" font-weight="700" fill="#4338ca">struct Student</text><rect x="250" y="160" width="200" height="58" rx="12" fill="#fff"/><text x="350" y="197" text-anchor="middle" font-size="21" fill="#0f172a">name = "민수"</text><rect x="250" y="235" width="200" height="58" rx="12" fill="#fff"/><text x="350" y="272" text-anchor="middle" font-size="21" fill="#0f172a">score = 90</text><rect x="500" y="160" width="210" height="145" rx="18" fill="#fff7ed" stroke="#f59e0b" stroke-width="3"/><text x="605" y="195" text-anchor="middle" font-size="22" font-weight="700" fill="#b45309">birth : Date</text><text x="605" y="235" text-anchor="middle" font-size="20" fill="#334155">year = 2005</text><text x="605" y="267" text-anchor="middle" font-size="20" fill="#334155">month = 3</text><text x="605" y="299" text-anchor="middle" font-size="20" fill="#334155">day = 15</text><text x="480" y="402" text-anchor="middle" font-size="20" fill="#475569">접근 예: student.birth.year</text></g></svg>