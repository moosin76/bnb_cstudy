<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="t d"><title id="t">구조체를 함수에 값으로 전달하면 복사된다</title><desc id="d">main의 구조체가 함수 매개변수로 복사되어 별개의 구조체가 되는 그림</desc><rect width="960" height="420" rx="24" fill="#f8fafc"/><g font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif"><text x="480" y="48" text-anchor="middle" font-size="28" font-weight="700" fill="#0f172a">구조체도 값으로 전달하면 복사본이 생깁니다</text><rect x="70" y="105" width="300" height="225" rx="22" fill="#eef6ff" stroke="#3b82f6" stroke-width="4"/><text x="220" y="145" text-anchor="middle" font-size="25" font-weight="700" fill="#1d4ed8">main의 student</text><text x="220" y="195" text-anchor="middle" font-size="21" fill="#334155">name = 민수</text><text x="220" y="235" text-anchor="middle" font-size="21" fill="#334155">age = 20</text><text x="220" y="275" text-anchor="middle" font-size="21" fill="#334155">score = 90</text><text x="480" y="205" text-anchor="middle" font-size="55" fill="#64748b">→</text><text x="480" y="250" text-anchor="middle" font-size="19" fill="#475569">값 복사</text><rect x="590" y="105" width="300" height="225" rx="22" fill="#fff7ed" stroke="#f59e0b" stroke-width="4"/><text x="740" y="145" text-anchor="middle" font-size="25" font-weight="700" fill="#b45309">함수의 s</text><text x="740" y="195" text-anchor="middle" font-size="21" fill="#334155">name = 민수</text><text x="740" y="235" text-anchor="middle" font-size="21" fill="#334155">age = 20</text><text x="740" y="275" text-anchor="middle" font-size="21" fill="#334155">score = 90</text><text x="480" y="377" text-anchor="middle" font-size="21" fill="#475569">함수 안의 s를 바꿔도 main의 student는 그대로입니다.</text></g></svg>