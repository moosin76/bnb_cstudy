<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
<title id="title">배열을 함수에 전달하면 같은 배열을 가리킨다</title><desc id="desc">main의 배열 첫 원소 주소가 함수의 arr 매개변수로 복사되어 같은 배열을 가리키는 관계</desc>
<rect width="960" height="430" rx="24" fill="#f8fafc"/><g font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
<text x="480" y="46" text-anchor="middle" font-size="28" font-weight="700" fill="#0f172a">주소가 복사되어도 두 포인터는 같은 원본 배열을 가리킵니다</text>
<rect x="70" y="95" width="300" height="250" rx="20" fill="#fff" stroke="#3b82f6" stroke-width="3"/><text x="220" y="132" text-anchor="middle" font-size="23" font-weight="700" fill="#1d4ed8">main()</text>
<rect x="105" y="165" width="70" height="70" rx="10" fill="#eff6ff" stroke="#60a5fa"/><rect x="175" y="165" width="70" height="70" rx="10" fill="#eff6ff" stroke="#60a5fa"/><rect x="245" y="165" width="70" height="70" rx="10" fill="#eff6ff" stroke="#60a5fa"/><g font-family="Consolas, monospace" font-size="25" font-weight="700" text-anchor="middle"><text x="140" y="208">10</text><text x="210" y="208">20</text><text x="280" y="208">30</text></g><text x="220" y="276" text-anchor="middle" font-family="Consolas, monospace" font-size="22" fill="#334155">numbers</text>
<rect x="590" y="95" width="300" height="250" rx="20" fill="#fff" stroke="#8b5cf6" stroke-width="3"/><text x="740" y="132" text-anchor="middle" font-size="23" font-weight="700" fill="#6d28d9">change(int arr[], ...)</text><rect x="660" y="183" width="160" height="70" rx="12" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/><text x="740" y="215" text-anchor="middle" font-family="Consolas, monospace" font-size="22" font-weight="700">arr</text><text x="740" y="240" text-anchor="middle" font-size="17" fill="#475569">첫 원소 주소 보관</text>
<path d="M660 218 C560 218 470 205 315 200" fill="none" stroke="#7c3aed" stroke-width="5"/><text x="480" y="190" text-anchor="middle" font-size="18" fill="#6d28d9">같은 배열을 가리킴</text>
<text x="480" y="390" text-anchor="middle" font-size="20" fill="#475569">함수에서 arr[0]을 바꾸면 main의 numbers[0]도 바뀝니다.</text></g></svg>