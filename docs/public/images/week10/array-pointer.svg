<svg xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img" aria-labelledby="title desc">
<title id="title">배열 이름과 첫 번째 원소의 주소</title><desc id="desc">배열 scores의 첫 번째 원소 주소를 배열 이름 scores와 포인터 p가 함께 가리키는 모습</desc>
<rect width="960" height="390" rx="24" fill="#f8fafc"/>
<g font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
<text x="480" y="48" text-anchor="middle" font-size="29" font-weight="700" fill="#0f172a">배열 이름은 첫 번째 원소의 주소처럼 사용할 수 있습니다</text>
<g font-family="Consolas, monospace" font-size="21" text-anchor="middle">
<text x="210" y="112" fill="#475569">scores[0]</text><text x="390" y="112" fill="#475569">scores[1]</text><text x="570" y="112" fill="#475569">scores[2]</text><text x="750" y="112" fill="#475569">scores[3]</text>
</g>
<g>
<rect x="120" y="130" width="180" height="100" rx="14" fill="#fff" stroke="#3b82f6" stroke-width="3"/><rect x="300" y="130" width="180" height="100" rx="14" fill="#fff" stroke="#94a3b8" stroke-width="2"/><rect x="480" y="130" width="180" height="100" rx="14" fill="#fff" stroke="#94a3b8" stroke-width="2"/><rect x="660" y="130" width="180" height="100" rx="14" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
<g font-family="Consolas, monospace" font-size="38" font-weight="700" fill="#0f172a" text-anchor="middle"><text x="210" y="192">70</text><text x="390" y="192">80</text><text x="570" y="192">90</text><text x="750" y="192">100</text></g>
</g>
<path d="M210 314 C210 280 210 262 210 232" fill="none" stroke="#2563eb" stroke-width="5" marker-end="url(#a)"/>
<path d="M395 314 C330 302 270 272 225 232" fill="none" stroke="#7c3aed" stroke-width="5" marker-end="url(#b)"/>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker><marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#7c3aed"/></marker></defs>
<text x="190" y="347" font-family="Consolas, monospace" font-size="24" font-weight="700" fill="#2563eb">scores</text><text x="385" y="347" font-family="Consolas, monospace" font-size="24" font-weight="700" fill="#7c3aed">p = scores</text>
</g></svg>