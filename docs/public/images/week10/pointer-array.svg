<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
<title id="title">포인터 배열</title><desc id="desc">포인터 배열의 각 칸이 서로 다른 변수 또는 문자열을 가리키는 구조</desc>
<rect width="960" height="430" rx="24" fill="#f8fafc"/><g font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
<text x="480" y="48" text-anchor="middle" font-size="29" font-weight="700" fill="#0f172a">포인터 배열 = 주소를 여러 개 저장하는 배열</text>
<g><rect x="90" y="125" width="155" height="80" rx="12" fill="#fff" stroke="#3b82f6" stroke-width="3"/><rect x="90" y="205" width="155" height="80" rx="12" fill="#fff" stroke="#8b5cf6" stroke-width="3"/><rect x="90" y="285" width="155" height="80" rx="12" fill="#fff" stroke="#f59e0b" stroke-width="3"/></g>
<g text-anchor="middle" font-family="Consolas, monospace" font-size="21" font-weight="700"><text x="167" y="173">names[0]</text><text x="167" y="253">names[1]</text><text x="167" y="333">names[2]</text></g>
<g><rect x="650" y="125" width="200" height="60" rx="12" fill="#eff6ff" stroke="#60a5fa"/><rect x="650" y="215" width="200" height="60" rx="12" fill="#f5f3ff" stroke="#a78bfa"/><rect x="650" y="305" width="200" height="60" rx="12" fill="#fffbeb" stroke="#fbbf24"/></g>
<g text-anchor="middle" font-size="23" font-weight="700"><text x="750" y="163">"철수"</text><text x="750" y="253">"영희"</text><text x="750" y="343">"민수"</text></g>
<g fill="none" stroke-width="4"><path d="M245 165 C390 165 500 155 650 155" stroke="#2563eb"/><path d="M245 245 C390 245 500 245 650 245" stroke="#7c3aed"/><path d="M245 325 C390 325 500 335 650 335" stroke="#d97706"/></g>
<text x="480" y="403" text-anchor="middle" font-size="19" fill="#475569">각 칸에 일반 값이 아니라 다른 위치를 가리키는 주소가 들어갑니다.</text></g></svg>