<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
<title id="title">이중 포인터의 연결 구조</title><desc id="desc">이중 포인터 pp가 포인터 p를 가리키고 p가 변수 a를 가리키는 두 단계 화살표</desc>
<rect width="960" height="430" rx="24" fill="#f8fafc"/><g font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
<text x="480" y="50" text-anchor="middle" font-size="29" font-weight="700" fill="#0f172a">이중 포인터는 “포인터를 가리키는 포인터”입니다</text>
<rect x="100" y="135" width="200" height="150" rx="18" fill="#fff" stroke="#f59e0b" stroke-width="3"/><rect x="380" y="135" width="200" height="150" rx="18" fill="#fff" stroke="#8b5cf6" stroke-width="3"/><rect x="660" y="135" width="200" height="150" rx="18" fill="#fff" stroke="#3b82f6" stroke-width="3"/>
<g text-anchor="middle"><text x="200" y="180" font-family="Consolas, monospace" font-size="34" font-weight="700" fill="#b45309">pp</text><text x="200" y="216" font-size="19" fill="#475569">p의 주소 저장</text><text x="200" y="252" font-family="Consolas, monospace" font-size="20">int **pp</text><text x="480" y="180" font-family="Consolas, monospace" font-size="34" font-weight="700" fill="#6d28d9">p</text><text x="480" y="216" font-size="19" fill="#475569">a의 주소 저장</text><text x="480" y="252" font-family="Consolas, monospace" font-size="20">int *p</text><text x="760" y="180" font-family="Consolas, monospace" font-size="34" font-weight="700" fill="#1d4ed8">a</text><text x="760" y="216" font-size="19" fill="#475569">실제 정수값</text><text x="760" y="252" font-family="Consolas, monospace" font-size="28" font-weight="700">10</text></g>
<path d="M300 210 L380 210" stroke="#d97706" stroke-width="6"/><path d="M580 210 L660 210" stroke="#7c3aed" stroke-width="6"/><text x="340" y="195" text-anchor="middle" font-family="Consolas, monospace" font-size="19" fill="#b45309">*pp = p</text><text x="620" y="195" text-anchor="middle" font-family="Consolas, monospace" font-size="19" fill="#6d28d9">*p = a</text>
<text x="480" y="360" text-anchor="middle" font-family="Consolas, monospace" font-size="25" font-weight="700" fill="#0f172a">**pp = 10</text><text x="480" y="397" text-anchor="middle" font-size="19" fill="#475569">별표를 두 번 따라가면 최종 정수값에 도착합니다.</text></g></svg>