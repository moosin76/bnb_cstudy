<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="t d"><title id="t">C++ 참조자</title><desc id="d">a와 ref가 같은 정수 저장 공간을 두 이름으로 가리키는 참조자의 개념을 보여준다.</desc><rect width="960" height="420" rx="24" fill="#f8fafc"/><g font-family="Malgun Gothic, sans-serif"><text x="480" y="48" text-anchor="middle" font-size="30" font-weight="700" fill="#0f172a">참조자는 같은 상자에 붙인 또 하나의 이름</text><rect x="340" y="145" width="280" height="125" rx="20" fill="#dbeafe" stroke="#3b82f6" stroke-width="4"/><text x="480" y="192" text-anchor="middle" font-size="22" fill="#334155">정수 저장 공간</text><text x="480" y="240" text-anchor="middle" font-family="Consolas, monospace" font-size="42" font-weight="700" fill="#1d4ed8">10</text><rect x="95" y="155" width="170" height="95" rx="16" fill="#fff" stroke="#60a5fa" stroke-width="2"/><text x="180" y="195" text-anchor="middle" font-family="Consolas, monospace" font-size="31" font-weight="700" fill="#1d4ed8">a</text><text x="180" y="225" text-anchor="middle" font-size="18" fill="#475569">원래 이름</text><line x1="265" y1="202" x2="335" y2="202" stroke="#3b82f6" stroke-width="4"/><rect x="695" y="155" width="170" height="95" rx="16" fill="#fff" stroke="#a78bfa" stroke-width="2"/><text x="780" y="195" text-anchor="middle" font-family="Consolas, monospace" font-size="31" font-weight="700" fill="#6d28d9">ref</text><text x="780" y="225" text-anchor="middle" font-size="18" fill="#475569">참조 이름</text><line x1="625" y1="202" x2="695" y2="202" stroke="#8b5cf6" stroke-width="4"/><text x="480" y="335" text-anchor="middle" font-family="Consolas, monospace" font-size="22" fill="#0f172a">int&amp; ref = a;</text><text x="480" y="372" text-anchor="middle" font-size="19" fill="#475569">ref를 바꾸면 같은 공간을 쓰는 a의 값도 바뀝니다.</text></g></svg>