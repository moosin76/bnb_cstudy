<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="t d"><title id="t">C와 C++의 관계</title><desc id="d">C에서 배운 변수, 조건문, 반복문, 함수, 포인터를 C++에서도 사용하고 그 위에 클래스와 객체 등의 기능이 추가되는 모습을 보여준다.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#64748b"/></marker></defs><rect width="960" height="420" rx="24" fill="#f8fafc"/><g font-family="Malgun Gothic, sans-serif"><text x="480" y="48" text-anchor="middle" font-size="30" font-weight="700" fill="#0f172a">C에서 배운 내용은 C++에서도 큰 자산입니다</text><rect x="65" y="100" width="335" height="230" rx="20" fill="#dbeafe" stroke="#60a5fa" stroke-width="3"/><text x="232" y="138" text-anchor="middle" font-size="27" font-weight="700" fill="#1d4ed8">C에서 이미 배운 것</text><g font-size="20" fill="#334155"><text x="105" y="180">• 변수와 자료형</text><text x="105" y="215">• if / for / while</text><text x="105" y="250">• 함수와 배열</text><text x="105" y="285">• 포인터와 구조체</text></g><line x1="425" y1="215" x2="535" y2="215" stroke="#64748b" stroke-width="5" marker-end="url(#a)"/><rect x="560" y="100" width="335" height="230" rx="20" fill="#ede9fe" stroke="#a78bfa" stroke-width="3"/><text x="727" y="138" text-anchor="middle" font-size="27" font-weight="700" fill="#6d28d9">C++에서 더 배우는 것</text><g font-size="20" fill="#334155"><text x="600" y="180">• cout / cin</text><text x="600" y="215">• 참조자와 오버로딩</text><text x="600" y="250">• 클래스와 객체</text><text x="600" y="285">• 생성자와 접근 제어</text></g><text x="480" y="380" text-anchor="middle" font-size="20" font-weight="700" fill="#0f766e">C를 버리는 것이 아니라, C에서 배운 기초 위에 새로운 도구를 얹는다고 생각하세요.</text></g></svg>