<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-labelledby="t d"><title id="t">함수 오버로딩</title><desc id="d">같은 add라는 함수 이름을 정수용과 실수용으로 여러 개 정의하고 전달되는 자료형에 따라 알맞은 함수가 선택되는 모습을 보여준다.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#64748b"/></marker></defs><rect width="960" height="400" rx="24" fill="#f8fafc"/><g font-family="Malgun Gothic, sans-serif"><text x="480" y="48" text-anchor="middle" font-size="30" font-weight="700" fill="#0f172a">같은 이름, 다른 매개변수 = 함수 오버로딩</text><rect x="60" y="125" width="235" height="90" rx="18" fill="#dbeafe" stroke="#60a5fa" stroke-width="3"/><text x="177" y="165" text-anchor="middle" font-family="Consolas, monospace" font-size="22" fill="#1d4ed8">add(2, 3)</text><text x="177" y="194" text-anchor="middle" font-size="17" fill="#475569">정수 두 개</text><line x1="300" y1="170" x2="410" y2="170" stroke="#64748b" stroke-width="4" marker-end="url(#a)"/><rect x="435" y="115" width="250" height="110" rx="18" fill="#fff" stroke="#3b82f6" stroke-width="3"/><text x="560" y="160" text-anchor="middle" font-family="Consolas, monospace" font-size="19" fill="#1e40af">int add(int, int)</text><text x="560" y="195" text-anchor="middle" font-size="18" fill="#334155">정수용 함수 선택</text><rect x="60" y="255" width="235" height="90" rx="18" fill="#f3e8ff" stroke="#c084fc" stroke-width="3"/><text x="177" y="295" text-anchor="middle" font-family="Consolas, monospace" font-size="22" fill="#7e22ce">add(2.5, 3.1)</text><text x="177" y="324" text-anchor="middle" font-size="17" fill="#475569">실수 두 개</text><line x1="300" y1="300" x2="410" y2="300" stroke="#64748b" stroke-width="4" marker-end="url(#a)"/><rect x="435" y="245" width="250" height="110" rx="18" fill="#fff" stroke="#a855f7" stroke-width="3"/><text x="560" y="290" text-anchor="middle" font-family="Consolas, monospace" font-size="19" fill="#7e22ce">double add(double, double)</text><text x="560" y="325" text-anchor="middle" font-size="18" fill="#334155">실수용 함수 선택</text><text x="805" y="230" text-anchor="middle" font-size="20" font-weight="700" fill="#0f766e">호출하는 쪽은<br/>add라는 이름만 기억</text></g></svg>