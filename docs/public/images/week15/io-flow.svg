<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-labelledby="t d"><title id="t">C++의 cin과 cout 흐름</title><desc id="d">키보드 입력이 cin을 거쳐 변수로 들어가고 변수가 cout을 거쳐 화면으로 출력되는 흐름을 보여준다.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#2563eb"/></marker></defs><rect width="960" height="400" rx="24" fill="#f8fafc"/><g font-family="Malgun Gothic, sans-serif"><text x="480" y="48" text-anchor="middle" font-size="30" font-weight="700" fill="#0f172a">입력은 cin, 출력은 cout</text><rect x="60" y="135" width="180" height="105" rx="18" fill="#fff7ed" stroke="#fb923c" stroke-width="3"/><text x="150" y="178" text-anchor="middle" font-size="23" font-weight="700" fill="#9a3412">키보드</text><text x="150" y="210" text-anchor="middle" font-size="18" fill="#7c2d12">사용자 입력</text><line x1="245" y1="188" x2="350" y2="188" stroke="#2563eb" stroke-width="5" marker-end="url(#a)"/><text x="298" y="164" text-anchor="middle" font-family="Consolas, monospace" font-size="21" fill="#1d4ed8">cin &gt;&gt;</text><rect x="375" y="135" width="210" height="105" rx="18" fill="#dbeafe" stroke="#60a5fa" stroke-width="3"/><text x="480" y="178" text-anchor="middle" font-family="Consolas, monospace" font-size="27" font-weight="700" fill="#1d4ed8">int age</text><text x="480" y="210" text-anchor="middle" font-size="18" fill="#334155">프로그램의 변수</text><line x1="590" y1="188" x2="695" y2="188" stroke="#2563eb" stroke-width="5" marker-end="url(#a)"/><text x="642" y="164" text-anchor="middle" font-family="Consolas, monospace" font-size="21" fill="#1d4ed8">&lt;&lt; cout</text><rect x="720" y="135" width="180" height="105" rx="18" fill="#dcfce7" stroke="#4ade80" stroke-width="3"/><text x="810" y="178" text-anchor="middle" font-size="23" font-weight="700" fill="#166534">화면</text><text x="810" y="210" text-anchor="middle" font-size="18" fill="#166534">출력 결과</text><text x="480" y="325" text-anchor="middle" font-size="20" fill="#475569">화살표 모양을 보며 데이터가 어느 쪽으로 흐르는지 생각하면 쉽습니다.</text></g></svg>