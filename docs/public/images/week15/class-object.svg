<svg xmlns="http://www.w3.org/2000/svg" width="960" height="450" viewBox="0 0 960 450" role="img" aria-labelledby="t d"><title id="t">클래스와 객체</title><desc id="d">Student 클래스 설계도를 바탕으로 서로 다른 이름과 점수를 가진 두 객체가 만들어지는 모습을 보여준다.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#64748b"/></marker></defs><rect width="960" height="450" rx="24" fill="#f8fafc"/><g font-family="Malgun Gothic, sans-serif"><text x="480" y="48" text-anchor="middle" font-size="30" font-weight="700" fill="#0f172a">클래스는 설계도, 객체는 그 설계도로 만든 실제 물건</text><rect x="75" y="105" width="290" height="240" rx="20" fill="#dbeafe" stroke="#3b82f6" stroke-width="3"/><text x="220" y="145" text-anchor="middle" font-size="25" font-weight="700" fill="#1d4ed8">class Student</text><line x1="100" y1="165" x2="340" y2="165" stroke="#93c5fd" stroke-width="2"/><text x="115" y="205" font-family="Consolas, monospace" font-size="20" fill="#334155">name</text><text x="115" y="238" font-family="Consolas, monospace" font-size="20" fill="#334155">score</text><text x="115" y="285" font-family="Consolas, monospace" font-size="20" fill="#334155">show()</text><text x="220" y="325" text-anchor="middle" font-size="17" fill="#475569">설계도에는 어떤 정보와 기능이<br/>있는지만 정의합니다.</text><line x1="375" y1="190" x2="505" y2="145" stroke="#64748b" stroke-width="4" marker-end="url(#a)"/><line x1="375" y1="250" x2="505" y2="305" stroke="#64748b" stroke-width="4" marker-end="url(#a)"/><rect x="530" y="90" width="340" height="130" rx="18" fill="#dcfce7" stroke="#4ade80" stroke-width="3"/><text x="700" y="125" text-anchor="middle" font-size="22" font-weight="700" fill="#166534">객체 student1</text><text x="565" y="165" font-family="Consolas, monospace" font-size="19" fill="#334155">name = "민수"</text><text x="565" y="195" font-family="Consolas, monospace" font-size="19" fill="#334155">score = 90</text><rect x="530" y="250" width="340" height="130" rx="18" fill="#fef3c7" stroke="#fbbf24" stroke-width="3"/><text x="700" y="285" text-anchor="middle" font-size="22" font-weight="700" fill="#92400e">객체 student2</text><text x="565" y="325" font-family="Consolas, monospace" font-size="19" fill="#334155">name = "영희"</text><text x="565" y="355" font-family="Consolas, monospace" font-size="19" fill="#334155">score = 100</text><text x="480" y="420" text-anchor="middle" font-size="19" fill="#475569">같은 클래스로 여러 객체를 만들 수 있고, 각 객체는 자기 값을 따로 가집니다.</text></g></svg>