<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="t d"><title id="t">public과 private</title><desc id="d">클래스 안의 private 영역은 객체 밖에서 직접 접근하지 않고 public 함수라는 문을 통해 사용하는 개념을 보여준다.</desc><rect width="960" height="420" rx="24" fill="#f8fafc"/><g font-family="Malgun Gothic, sans-serif"><text x="480" y="48" text-anchor="middle" font-size="30" font-weight="700" fill="#0f172a">private는 안쪽 보관함, public은 사용할 수 있는 문</text><rect x="295" y="90" width="370" height="260" rx="22" fill="#fff" stroke="#64748b" stroke-width="3"/><text x="480" y="125" text-anchor="middle" font-family="Consolas, monospace" font-size="24" font-weight="700" fill="#0f172a">class BankAccount</text><rect x="335" y="155" width="290" height="75" rx="14" fill="#fee2e2" stroke="#f87171" stroke-width="2"/><text x="480" y="185" text-anchor="middle" font-size="20" font-weight="700" fill="#991b1b">private</text><text x="480" y="214" text-anchor="middle" font-family="Consolas, monospace" font-size="18" fill="#7f1d1d">int balance;</text><rect x="335" y="250" width="290" height="75" rx="14" fill="#dcfce7" stroke="#4ade80" stroke-width="2"/><text x="480" y="280" text-anchor="middle" font-size="20" font-weight="700" fill="#166534">public</text><text x="480" y="309" text-anchor="middle" font-family="Consolas, monospace" font-size="18" fill="#166534">deposit(), show()</text><rect x="50" y="190" width="175" height="90" rx="16" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/><text x="137" y="225" text-anchor="middle" font-size="20" font-weight="700" fill="#1d4ed8">객체 밖</text><text x="137" y="255" text-anchor="middle" font-size="17" fill="#475569">사용하는 코드</text><line x1="225" y1="235" x2="330" y2="285" stroke="#22c55e" stroke-width="5"/><text x="240" y="317" font-size="17" fill="#166534">public 함수로 접근</text><line x1="225" y1="210" x2="330" y2="190" stroke="#ef4444" stroke-width="4" stroke-dasharray="9 7"/><text x="64" y="155" font-size="17" fill="#b91c1c">private 직접 접근 ×</text><text x="480" y="390" text-anchor="middle" font-size="19" fill="#475569">중요한 데이터를 감추고 정해진 방법으로 사용하게 만드는 것을 캡슐화라고 합니다.</text></g></svg>