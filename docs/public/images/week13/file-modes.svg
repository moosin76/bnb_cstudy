<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-labelledby="title desc">
<title id="title">파일 열기 모드 r w a 비교</title><desc id="desc">읽기, 새로 쓰기, 이어 쓰기 모드의 차이를 세 칸으로 비교한다.</desc>
<rect width="960" height="470" rx="24" fill="#f8fafc"/>
<g font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
<text x="480" y="48" text-anchor="middle" font-size="29" font-weight="700" fill="#0f172a">fopen의 세 가지 기본 모드</text>
<g transform="translate(50 95)"><rect width="260" height="290" rx="18" fill="#fff" stroke="#2563eb" stroke-width="3"/><text x="130" y="58" text-anchor="middle" font-size="42" font-family="Consolas, monospace" font-weight="700" fill="#1d4ed8">r</text><text x="130" y="98" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">읽기</text><text x="130" y="150" text-anchor="middle" font-size="19" fill="#475569">기존 파일 필요</text><text x="130" y="190" text-anchor="middle" font-size="19" fill="#475569">내용을 읽음</text><text x="130" y="240" text-anchor="middle" font-size="18" fill="#dc2626">파일이 없으면 실패</text></g>
<g transform="translate(350 95)"><rect width="260" height="290" rx="18" fill="#fff" stroke="#dc2626" stroke-width="3"/><text x="130" y="58" text-anchor="middle" font-size="42" font-family="Consolas, monospace" font-weight="700" fill="#b91c1c">w</text><text x="130" y="98" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">새로 쓰기</text><text x="130" y="150" text-anchor="middle" font-size="19" fill="#475569">없으면 새로 생성</text><text x="130" y="190" text-anchor="middle" font-size="19" fill="#475569">처음부터 씀</text><text x="130" y="240" text-anchor="middle" font-size="18" font-weight="700" fill="#dc2626">기존 내용은 지워짐!</text></g>
<g transform="translate(650 95)"><rect width="260" height="290" rx="18" fill="#fff" stroke="#16a34a" stroke-width="3"/><text x="130" y="58" text-anchor="middle" font-size="42" font-family="Consolas, monospace" font-weight="700" fill="#15803d">a</text><text x="130" y="98" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">이어 쓰기</text><text x="130" y="150" text-anchor="middle" font-size="19" fill="#475569">없으면 새로 생성</text><text x="130" y="190" text-anchor="middle" font-size="19" fill="#475569">파일 끝에 추가</text><text x="130" y="240" text-anchor="middle" font-size="18" fill="#15803d">기존 내용 유지</text></g>
<text x="480" y="435" text-anchor="middle" font-size="21" font-weight="700" fill="#334155">처음에는 r · w · a 세 개부터 확실히 구분하세요.</text>
</g></svg>