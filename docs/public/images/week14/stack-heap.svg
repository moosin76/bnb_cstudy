<svg xmlns="http://www.w3.org/2000/svg" width="960" height="450" viewBox="0 0 960 450" role="img" aria-labelledby="t d"><title id="t">스택과 힙의 기본 구조</title><desc id="d">지역 포인터 변수는 스택 쪽에 있고 malloc으로 확보한 공간은 힙 쪽에 있으며 포인터가 힙 메모리를 가리킨다.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#7c3aed"/></marker></defs><rect width="960" height="450" rx="24" fill="#f8fafc"/><g font-family="Malgun Gothic, sans-serif"><text x="480" y="48" text-anchor="middle" font-size="30" font-weight="700" fill="#0f172a">포인터는 스택에, 빌린 공간은 힙에</text><rect x="70" y="95" width="300" height="280" rx="18" fill="#fff" stroke="#3b82f6" stroke-width="3"/><text x="220" y="135" text-anchor="middle" font-size="26" font-weight="700" fill="#1d4ed8">스택(Stack)</text><text x="220" y="172" text-anchor="middle" font-size="18" fill="#475569">함수의 지역변수 등</text><rect x="125" y="215" width="190" height="85" rx="12" fill="#dbeafe" stroke="#60a5fa"/><text x="220" y="248" text-anchor="middle" font-family="Consolas, monospace" font-size="22" fill="#0f172a">int *p</text><text x="220" y="279" text-anchor="middle" font-size="17" fill="#334155">힙의 주소를 저장</text><rect x="590" y="95" width="300" height="280" rx="18" fill="#fff" stroke="#10b981" stroke-width="3"/><text x="740" y="135" text-anchor="middle" font-size="26" font-weight="700" fill="#047857">힙(Heap)</text><text x="740" y="172" text-anchor="middle" font-size="18" fill="#475569">필요할 때 빌리는 메모리</text><rect x="650" y="215" width="180" height="85" rx="12" fill="#d1fae5" stroke="#34d399"/><text x="740" y="248" text-anchor="middle" font-family="Consolas, monospace" font-size="20" fill="#065f46">10 20 30 ...</text><text x="740" y="279" text-anchor="middle" font-size="17" fill="#334155">malloc()으로 확보</text><line x1="315" y1="255" x2="642" y2="255" stroke="#7c3aed" stroke-width="5" marker-end="url(#a)"/><text x="480" y="235" text-anchor="middle" font-size="18" font-weight="700" fill="#6d28d9">p가 가리킴</text><text x="480" y="410" text-anchor="middle" font-size="20" fill="#475569">힙 메모리는 사용이 끝나면 free()로 직접 반납합니다.</text></g></svg>