<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="t d"><title id="t">malloc과 calloc 비교</title><desc id="d">malloc은 초기 값이 정해지지 않은 메모리를 주고 calloc은 모든 비트를 0으로 초기화한 메모리를 준다.</desc><rect width="960" height="420" rx="24" fill="#f8fafc"/><g font-family="Malgun Gothic, sans-serif"><text x="480" y="48" text-anchor="middle" font-size="30" font-weight="700" fill="#0f172a">malloc()과 calloc()의 가장 큰 차이</text><rect x="60" y="95" width="390" height="260" rx="18" fill="#fff" stroke="#8b5cf6" stroke-width="3"/><text x="255" y="135" text-anchor="middle" font-size="26" font-weight="700" fill="#6d28d9">malloc()</text><text x="255" y="175" text-anchor="middle" font-size="18" fill="#475569">공간만 확보</text><g font-family="Consolas, monospace" font-size="20" text-anchor="middle"><rect x="105" y="215" width="70" height="60" fill="#ede9fe" stroke="#a78bfa"/><rect x="175" y="215" width="70" height="60" fill="#ede9fe" stroke="#a78bfa"/><rect x="245" y="215" width="70" height="60" fill="#ede9fe" stroke="#a78bfa"/><rect x="315" y="215" width="70" height="60" fill="#ede9fe" stroke="#a78bfa"/><text x="140" y="252" fill="#6b21a8">?</text><text x="210" y="252" fill="#6b21a8">?</text><text x="280" y="252" fill="#6b21a8">?</text><text x="350" y="252" fill="#6b21a8">?</text></g><text x="255" y="315" text-anchor="middle" font-size="18" fill="#334155">처음 값은 믿고 사용하면 안 됨</text><rect x="510" y="95" width="390" height="260" rx="18" fill="#fff" stroke="#10b981" stroke-width="3"/><text x="705" y="135" text-anchor="middle" font-size="26" font-weight="700" fill="#047857">calloc()</text><text x="705" y="175" text-anchor="middle" font-size="18" fill="#475569">공간 확보 + 0으로 초기화</text><g font-family="Consolas, monospace" font-size="20" text-anchor="middle"><rect x="555" y="215" width="70" height="60" fill="#d1fae5" stroke="#34d399"/><rect x="625" y="215" width="70" height="60" fill="#d1fae5" stroke="#34d399"/><rect x="695" y="215" width="70" height="60" fill="#d1fae5" stroke="#34d399"/><rect x="765" y="215" width="70" height="60" fill="#d1fae5" stroke="#34d399"/><text x="590" y="252" fill="#065f46">0</text><text x="660" y="252" fill="#065f46">0</text><text x="730" y="252" fill="#065f46">0</text><text x="800" y="252" fill="#065f46">0</text></g><text x="705" y="315" text-anchor="middle" font-size="18" fill="#334155">처음부터 0 상태로 시작</text></g></svg>