<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="t d"><title id="t">free 이후 댕글링 포인터</title><desc id="d">free 후 힙 메모리는 반납되지만 포인터 변수에는 예전 주소값이 남아 있을 수 있으므로 NULL로 바꾸는 습관을 보여준다.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#7c3aed"/></marker></defs><rect width="960" height="440" rx="24" fill="#f8fafc"/><g font-family="Malgun Gothic, sans-serif"><text x="480" y="48" text-anchor="middle" font-size="30" font-weight="700" fill="#0f172a">free() 후에는 그 메모리를 다시 사용하면 안 됩니다</text><rect x="75" y="105" width="250" height="220" rx="18" fill="#fff" stroke="#3b82f6" stroke-width="3"/><text x="200" y="145" text-anchor="middle" font-size="24" font-weight="700" fill="#1d4ed8">free 전</text><rect x="115" y="185" width="170" height="70" rx="12" fill="#dbeafe" stroke="#60a5fa"/><text x="200" y="228" text-anchor="middle" font-family="Consolas, monospace" font-size="22">p → 0x5000</text><line x1="325" y1="220" x2="570" y2="220" stroke="#7c3aed" stroke-width="5" marker-end="url(#a)"/><rect x="575" y="160" width="275" height="120" rx="15" fill="#d1fae5" stroke="#34d399" stroke-width="3"/><text x="712" y="205" text-anchor="middle" font-size="21" fill="#065f46">힙 메모리</text><text x="712" y="242" text-anchor="middle" font-family="Consolas, monospace" font-size="19">10 20 30</text><text x="480" y="350" text-anchor="middle" font-family="Consolas, monospace" font-size="20" fill="#b91c1c">free(p);</text><text x="480" y="388" text-anchor="middle" font-size="19" fill="#475569">반납 후에는 p = NULL; 로 바꾸는 습관을 들이면 실수를 줄일 수 있습니다.</text></g></svg>