<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="t d"><title id="t">malloc 사용 흐름</title><desc id="d">필요한 크기 계산, malloc 요청, NULL 확인, 사용, free 순서다.</desc><rect width="960" height="420" rx="24" fill="#f8fafc"/><g font-family="Malgun Gothic, sans-serif"><text x="480" y="50" text-anchor="middle" font-size="30" font-weight="700" fill="#0f172a">malloc()의 안전한 사용 순서</text><g font-size="18" text-anchor="middle"><rect x="38" y="125" width="160" height="95" rx="14" fill="#fff" stroke="#3b82f6" stroke-width="3"/><text x="118" y="160" font-weight="700" fill="#1d4ed8">① 크기 계산</text><text x="118" y="193" font-family="Consolas, monospace" fill="#334155">n * sizeof(int)</text><rect x="220" y="125" width="160" height="95" rx="14" fill="#fff" stroke="#8b5cf6" stroke-width="3"/><text x="300" y="160" font-weight="700" fill="#6d28d9">② 메모리 요청</text><text x="300" y="193" font-family="Consolas, monospace" fill="#334155">malloc(...)</text><rect x="402" y="125" width="160" height="95" rx="14" fill="#fff" stroke="#f59e0b" stroke-width="3"/><text x="482" y="160" font-weight="700" fill="#b45309">③ 실패 확인</text><text x="482" y="193" font-family="Consolas, monospace" fill="#334155">p == NULL ?</text><rect x="584" y="125" width="160" height="95" rx="14" fill="#fff" stroke="#10b981" stroke-width="3"/><text x="664" y="160" font-weight="700" fill="#047857">④ 사용</text><text x="664" y="193" font-family="Consolas, monospace" fill="#334155">p[0], p[1]...</text><rect x="766" y="125" width="160" height="95" rx="14" fill="#fff" stroke="#ef4444" stroke-width="3"/><text x="846" y="160" font-weight="700" fill="#b91c1c">⑤ 반납</text><text x="846" y="193" font-family="Consolas, monospace" fill="#334155">free(p)</text></g><text x="480" y="300" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">빌리기 → 확인하기 → 사용하기 → 돌려주기</text><text x="480" y="345" text-anchor="middle" font-size="19" fill="#475569">이 네 단어를 먼저 기억하면 malloc 문법이 훨씬 덜 어렵습니다.</text></g></svg>