<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="t d"><title id="t">고정 배열과 동적 메모리 비교</title><desc id="d">고정 배열은 크기를 미리 정하지만 동적 메모리는 실행 중 필요한 크기만큼 요청한다.</desc><rect width="960" height="420" rx="24" fill="#f8fafc"/><g font-family="Malgun Gothic, sans-serif"><text x="480" y="48" text-anchor="middle" font-size="30" font-weight="700" fill="#0f172a">고정 배열과 동적 메모리의 차이</text><rect x="55" y="95" width="380" height="255" rx="18" fill="#fff" stroke="#3b82f6" stroke-width="3"/><text x="245" y="135" text-anchor="middle" font-size="25" font-weight="700" fill="#1d4ed8">고정 배열</text><text x="245" y="175" text-anchor="middle" font-size="19" fill="#334155">프로그램을 작성할 때 크기를 정함</text><g font-family="Consolas, monospace" font-size="18"><rect x="95" y="215" width="55" height="55" fill="#dbeafe" stroke="#60a5fa"/><rect x="150" y="215" width="55" height="55" fill="#dbeafe" stroke="#60a5fa"/><rect x="205" y="215" width="55" height="55" fill="#dbeafe" stroke="#60a5fa"/><rect x="260" y="215" width="55" height="55" fill="#dbeafe" stroke="#60a5fa"/><rect x="315" y="215" width="55" height="55" fill="#dbeafe" stroke="#60a5fa"/><text x="232" y="305" text-anchor="middle" fill="#0f172a">int a[5];</text></g><rect x="525" y="95" width="380" height="255" rx="18" fill="#fff" stroke="#10b981" stroke-width="3"/><text x="715" y="135" text-anchor="middle" font-size="25" font-weight="700" fill="#047857">동적 메모리</text><text x="715" y="175" text-anchor="middle" font-size="19" fill="#334155">실행 중 입력에 따라 필요한 만큼 요청</text><rect x="575" y="215" width="280" height="55" rx="8" fill="#d1fae5" stroke="#34d399"/><text x="715" y="250" text-anchor="middle" font-size="20" fill="#065f46">필요한 개수만큼 확보</text><text x="715" y="305" text-anchor="middle" font-family="Consolas, monospace" font-size="18" fill="#0f172a">malloc(count * sizeof(int))</text></g></svg>