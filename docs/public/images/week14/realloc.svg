<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="t d"><title id="t">realloc으로 크기 변경</title><desc id="d">3칸 메모리를 5칸으로 늘릴 때 같은 위치에서 늘어날 수도 있고 다른 위치로 옮겨질 수도 있다.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#7c3aed"/></marker></defs><rect width="960" height="430" rx="24" fill="#f8fafc"/><g font-family="Malgun Gothic, sans-serif"><text x="480" y="48" text-anchor="middle" font-size="30" font-weight="700" fill="#0f172a">realloc()은 빌린 공간의 크기를 다시 조정합니다</text><text x="180" y="110" text-anchor="middle" font-size="21" font-weight="700" fill="#1d4ed8">변경 전: 3칸</text><g font-family="Consolas, monospace" font-size="20" text-anchor="middle"><rect x="65" y="145" width="75" height="65" fill="#dbeafe" stroke="#60a5fa"/><rect x="140" y="145" width="75" height="65" fill="#dbeafe" stroke="#60a5fa"/><rect x="215" y="145" width="75" height="65" fill="#dbeafe" stroke="#60a5fa"/><text x="102" y="185">10</text><text x="177" y="185">20</text><text x="252" y="185">30</text></g><line x1="320" y1="178" x2="545" y2="178" stroke="#7c3aed" stroke-width="5" marker-end="url(#a)"/><text x="430" y="150" text-anchor="middle" font-family="Consolas, monospace" font-size="18" fill="#6d28d9">realloc(..., 5칸)</text><text x="705" y="110" text-anchor="middle" font-size="21" font-weight="700" fill="#047857">변경 후: 5칸</text><g font-family="Consolas, monospace" font-size="20" text-anchor="middle"><rect x="545" y="145" width="70" height="65" fill="#d1fae5" stroke="#34d399"/><rect x="615" y="145" width="70" height="65" fill="#d1fae5" stroke="#34d399"/><rect x="685" y="145" width="70" height="65" fill="#d1fae5" stroke="#34d399"/><rect x="755" y="145" width="70" height="65" fill="#ecfdf5" stroke="#34d399"/><rect x="825" y="145" width="70" height="65" fill="#ecfdf5" stroke="#34d399"/><text x="580" y="185">10</text><text x="650" y="185">20</text><text x="720" y="185">30</text><text x="790" y="185">?</text><text x="860" y="185">?</text></g><rect x="110" y="270" width="740" height="95" rx="15" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/><text x="480" y="305" text-anchor="middle" font-size="19" font-weight="700" fill="#9a3412">중요: 더 큰 연속 공간이 없으면 메모리가 다른 위치로 이동할 수도 있습니다.</text><text x="480" y="338" text-anchor="middle" font-size="18" fill="#7c2d12">그래서 realloc()의 반환값을 반드시 새 포인터로 확인해야 합니다.</text></g></svg>