<svg xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img" aria-labelledby="title desc">
  <title id="title">변수의 범위와 수명 비교</title>
  <desc id="desc">범위는 변수를 사용할 수 있는 코드 구역이고 수명은 변수가 존재하는 시간을 뜻한다는 비교 그림</desc>
  <rect width="960" height="390" rx="24" fill="#f8fafc"/>
  <g font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
    <text x="480" y="46" font-size="28" font-weight="700" text-anchor="middle" fill="#0f172a">범위(scope)와 수명(lifetime)은 서로 다른 질문입니다</text>

    <rect x="55" y="85" width="390" height="245" rx="20" fill="#eef6ff" stroke="#60a5fa" stroke-width="3"/>
    <text x="250" y="124" font-size="24" font-weight="700" text-anchor="middle" fill="#1e3a8a">범위 · 어디에서 이름을 쓸 수 있나?</text>
    <rect x="105" y="155" width="290" height="135" rx="14" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
    <text x="130" y="192" font-size="20" fill="#334155">void hello(void) {</text>
    <text x="155" y="228" font-size="20" font-weight="700" fill="#1d4ed8">int count = 3;</text>
    <text x="155" y="264" font-size="20" fill="#334155">printf("%d", count);</text>
    <text x="130" y="292" font-size="20" fill="#334155">}</text>
    <text x="250" y="320" font-size="18" text-anchor="middle" fill="#475569">count라는 이름은 hello() 안에서 사용</text>

    <rect x="515" y="85" width="390" height="245" rx="20" fill="#effcf4" stroke="#55b37a" stroke-width="3"/>
    <text x="710" y="124" font-size="24" font-weight="700" text-anchor="middle" fill="#276749">수명 · 언제까지 값이 살아 있나?</text>
    <line x1="565" y1="215" x2="855" y2="215" stroke="#55b37a" stroke-width="7" stroke-linecap="round"/>
    <polygon points="855,215 830,198 830,232" fill="#55b37a"/>
    <circle cx="610" cy="215" r="12" fill="#276749"/>
    <circle cx="805" cy="215" r="12" fill="#276749"/>
    <text x="610" y="178" font-size="19" text-anchor="middle" fill="#334155">함수 시작</text>
    <text x="805" y="178" font-size="19" text-anchor="middle" fill="#334155">함수 종료</text>
    <text x="710" y="265" font-size="20" font-weight="700" text-anchor="middle" fill="#276749">일반 지역변수는 보통 이 호출 동안 존재</text>
    <text x="710" y="300" font-size="18" text-anchor="middle" fill="#475569">static 지역변수는 다음 호출에도 값을 기억</text>

    <text x="480" y="365" font-size="21" font-weight="700" text-anchor="middle" fill="#0f172a">범위 = 장소에 대한 질문 · 수명 = 시간에 대한 질문</text>
  </g>
</svg>