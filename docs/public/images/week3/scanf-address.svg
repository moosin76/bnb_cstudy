<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc">
  <title id="title">scanf에서 &amp;가 필요한 이유</title>
  <desc id="desc">사용자가 입력한 25를 age 변수 상자의 위치를 알려 주는 &amp;age를 통해 저장하는 개념 그림</desc>
  <rect width="960" height="300" rx="24" fill="#f8fafc"/>
  <g font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" text-anchor="middle">
    <text x="480" y="42" font-size="27" font-weight="700" fill="#0f172a">scanf()는 값을 넣을 “변수의 위치”를 알아야 합니다</text>

    <rect x="55" y="86" width="210" height="140" rx="20" fill="#eef6ff" stroke="#60a5fa" stroke-width="3"/>
    <text x="160" y="125" font-size="20" fill="#334155">사용자 입력</text>
    <text x="160" y="182" font-size="46" font-weight="700" fill="#1d4ed8">25</text>

    <rect x="360" y="86" width="240" height="140" rx="20" fill="#fff7ed" stroke="#f0a34a" stroke-width="3"/>
    <text x="480" y="126" font-size="20" fill="#334155">변수의 위치를 알려 줌</text>
    <text x="480" y="181" font-size="42" font-weight="700" fill="#c26a00">&amp;age</text>

    <rect x="695" y="86" width="210" height="140" rx="20" fill="#effcf4" stroke="#55b37a" stroke-width="3"/>
    <text x="800" y="124" font-size="20" fill="#334155">age 변수</text>
    <rect x="745" y="144" width="110" height="54" rx="10" fill="#ffffff" stroke="#55b37a" stroke-width="2"/>
    <text x="800" y="181" font-size="34" font-weight="700" fill="#276749">25</text>

    <line x1="275" y1="156" x2="345" y2="156" stroke="#3b82f6" stroke-width="8" stroke-linecap="round"/>
    <polygon points="345,156 324,142 324,170" fill="#3b82f6"/>
    <line x1="610" y1="156" x2="680" y2="156" stroke="#55b37a" stroke-width="8" stroke-linecap="round"/>
    <polygon points="680,156 659,142 659,170" fill="#55b37a"/>

    <text x="480" y="268" font-size="20" fill="#475569">처음에는 “&amp;age = age 상자의 위치표”라고 이해하면 충분합니다.</text>
  </g>
</svg>